name: Modernization dependency resolution (experimental)

on:
  push:
    branches:
      - modernization/laravel13-php84

permissions:
  contents: read

jobs:
  resolve-composer:
    name: Resolve Laravel 13 dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, dom, zip, gd, exif, fileinfo, intl, pdo_mysql, xml
          coverage: none
          tools: composer:v2

      - name: Validate candidate manifest without requiring old lock
        run: composer validate --no-check-lock --no-check-publish

      - name: Resolve packages and generate candidate lockfile
        run: composer update --with-all-dependencies --no-install --no-scripts --no-interaction --no-progress

      - name: Upload candidate lockfile for review
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: composer-lock-laravel13-probe
          path: composer.lock
          if-no-files-found: error
          retention-days: 7

      - name: Audit resolved PHP packages without suppressing advisories
        if: success()
        run: composer audit --locked
