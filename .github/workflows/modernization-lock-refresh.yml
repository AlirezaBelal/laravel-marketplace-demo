name: Update candidate Composer lockfile (experimental only)

on:
  push:
    branches:
      - modernization/laravel13-php84
    paths:
      - composer.json
      - .github/workflows/modernization-lock-refresh.yml

permissions:
  contents: write

jobs:
  update-lock:
    if: github.repository == 'AlirezaBelal/laravel-marketplace-demo' && github.ref == 'refs/heads/modernization/laravel13-php84'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, curl, dom, zip, gd, exif, fileinfo, intl, pdo_mysql, xml
          coverage: none
          tools: composer:v2

      - name: Resolve lockfile without third-party code execution
        run: composer update --with-all-dependencies --no-install --no-scripts --no-plugins --no-interaction --no-progress

      - name: Require zero locked PHP advisories
        run: composer audit --locked

      - name: Commit candidate lockfile only to modernization branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- composer.lock
          if git diff --cached --quiet; then
            echo 'Lockfile already matches candidate.'
            exit 0
          fi
          git commit -m 'chore(modernization): resolve Laravel 13 PHP dependency lock'
          git push origin HEAD:refs/heads/modernization/laravel13-php84
