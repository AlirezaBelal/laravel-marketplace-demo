name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  repository-contract:
    name: Repository safety contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Run repository safety contract
        run: php tests/repository_safety.php

      - name: Lint PHP source
        run: |
          find app bootstrap config database routes tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

  php:
    name: PHP framework checks (Laravel 13 candidate)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare local test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Framework boot smoke
        run: |
          php artisan --version
          php artisan route:list

      - name: Compile Blade views
        run: php artisan view:cache

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit

      - name: Render guest authentication page through Livewire 4
        run: vendor/bin/phpunit tests/Feature/ModernizationAuthSmokeTest.php

      - name: Identify source of failed compiled Blade view
        if: failure()
        shell: bash
        run: |
          php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $compiler = $app->make("blade.compiler");
          $needle = "c918496435ed5bdb80de86eb62198b81.php";
          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator("resources/views", FilesystemIterator::SKIP_DOTS));
          foreach ($iterator as $file) {
              if (!str_ends_with($file->getFilename(), ".blade.php")) continue;
              if (basename($compiler->getCompiledPath($file->getRealPath())) === $needle) {
                  echo "Original Blade view: ".$file->getPathname().PHP_EOL;
              }
          }
          '


  frontend:
    name: Frontend build and runtime dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production assets
        run: npm run production

      - name: Audit runtime frontend dependencies
        run: npm audit --omit=dev --audit-level=high
