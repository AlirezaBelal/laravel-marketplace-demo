name: Livewire route case normalization

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/livewire-route-case.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize case-only Livewire route class paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('app/Http/Livewire')
          canonical = {
              str(path.relative_to(root).with_suffix('')).replace('/', '\\').lower():
              str(path.relative_to(root).with_suffix('')).replace('/', '\\')
              for path in root.rglob('*.php')
          }
          pattern = re.compile(r'\\App\\Http\\Livewire\\([A-Za-z0-9_\\]+)::class')
          changed = []

          for route_file in Path('routes').glob('*.php'):
              text = route_file.read_text(encoding='utf-8')

              def replace(match):
                  relative = match.group(1)
                  corrected = canonical.get(relative.lower())
                  if corrected and corrected != relative:
                      changed.append((str(route_file), relative, corrected))
                      return r'\App\Http\Livewire\' + corrected + '::class'
                  return match.group(0)

              updated = pattern.sub(replace, text)
              if updated != text:
                  route_file.write_text(updated, encoding='utf-8')

          for route_file, old, new in changed:
              print(f'{route_file}: {old} -> {new}')
          PY

      - name: Commit normalized routes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routes
          if git diff --cached --quiet; then
            echo 'No case-only route changes required.'
          else
            git commit -m 'fix: normalize case-sensitive Livewire route class paths'
            git push origin HEAD:master
          fi
