name: Route namespace normalization

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/route-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize case-sensitive Livewire namespaces
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('routes/admin.php')
          text = path.read_text(encoding='utf-8')
          replacements = {
              r'App\Http\Livewire\Admin\categorylevel4': r'App\Http\Livewire\Admin\Categorylevel4',
              r'App\Http\Livewire\Admin\Product\attributeValue': r'App\Http\Livewire\Admin\Product\AttributeValue',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit normalized routes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routes/admin.php
          if git diff --cached --quiet; then
            echo 'No route changes required.'
          else
            git commit -m 'fix: normalize case-sensitive Livewire route namespaces'
            git push origin HEAD:master
          fi
