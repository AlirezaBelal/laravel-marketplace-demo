name: Database migration and feature compatibility

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  mysql-migrations:
    name: Fresh migrations on disposable MySQL 8.4
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: marketplace_test
          MYSQL_USER: marketplace_test
          MYSQL_PASSWORD: test_only_password
          MYSQL_ROOT_PASSWORD: test_only_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out candidate
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up PHP and MySQL driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare synthetic test application key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Provision the five historical category databases
        env:
          MYSQL_PWD: test_only_root_password
        run: |
          mysql --host=127.0.0.1 --user=root --execute="
            CREATE DATABASE digikala_category;
            CREATE DATABASE digikala_electronic;
            CREATE DATABASE digikala_vehicle;
            CREATE DATABASE digikala_apparel;
            CREATE DATABASE digikala_child;
            GRANT ALL ON digikala_category.* TO 'marketplace_test'@'%';
            GRANT ALL ON digikala_electronic.* TO 'marketplace_test'@'%';
            GRANT ALL ON digikala_vehicle.* TO 'marketplace_test'@'%';
            GRANT ALL ON digikala_apparel.* TO 'marketplace_test'@'%';
            GRANT ALL ON digikala_child.* TO 'marketplace_test'@'%';
          "

      - name: Run full historical migrations against disposable database
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: marketplace_test
          DB_USERNAME: marketplace_test
          DB_PASSWORD: test_only_password
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: php artisan migrate:fresh --force --no-interaction

      - name: Verify a second migration pass is idempotent
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: marketplace_test
          DB_USERNAME: marketplace_test
          DB_PASSWORD: test_only_password
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: php artisan migrate --force --no-interaction

  full-feature-tests:
    name: Complete feature suite on disposable MySQL 8.4
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: marketplace_test
          MYSQL_USER: marketplace_test
          MYSQL_PASSWORD: test_only_password
          MYSQL_ROOT_PASSWORD: test_only_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out candidate
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up PHP and MySQL driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node.js for Blade/Vite rendering
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Build real test assets
        run: |
          npm ci
          npm run build

      - name: Prepare synthetic test application key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Provision the five historical category databases
        env:
          MYSQL_PWD: test_only_root_password
        run: |
          mysql --host=127.0.0.1 --user=root --execute="
            CREATE DATABASE digikala_category;
            CREATE DATABASE digikala_electronic;
            CREATE DATABASE digikala_vehicle;
            CREATE DATABASE digikala_apparel;
            CREATE DATABASE digikala_child;
            GRANT ALL ON digikala_category.* TO 'marketplace_test'@'%';
            GRANT ALL ON digikala_electronic.* TO 'marketplace_test'@'%';
            GRANT ALL ON digikala_vehicle.* TO 'marketplace_test'@'%';
            GRANT ALL ON digikala_apparel.* TO 'marketplace_test'@'%';
            GRANT ALL ON digikala_child.* TO 'marketplace_test'@'%';
          "

      - name: Run the complete feature suite without external services
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: marketplace_test
          DB_USERNAME: marketplace_test
          DB_PASSWORD: test_only_password
          CACHE_STORE: array
          SESSION_DRIVER: array
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
        run: vendor/bin/phpunit --testsuite Feature --colors=never --display-phpunit-deprecations

      - name: Open public storefront and auth entry points in headless Chrome
        env:
          APP_ENV: testing
          APP_DEBUG: "false"
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: marketplace_test
          DB_USERNAME: marketplace_test
          DB_PASSWORD: test_only_password
          CACHE_STORE: array
          SESSION_DRIVER: array
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
        run: bash tests/browser_smoke.sh
