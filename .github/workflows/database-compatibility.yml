name: Fresh database migration compatibility (candidate)

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  mysql-migrations:
    name: Fresh migrations on disposable MySQL 8.4
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: marketplace_test
          MYSQL_USER: marketplace_test
          MYSQL_PASSWORD: test_only_password
          MYSQL_ROOT_PASSWORD: test_only_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP and MySQL driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare synthetic test application key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run full historical migrations against disposable database
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: marketplace_test
          DB_USERNAME: marketplace_test
          DB_PASSWORD: test_only_password
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: php artisan migrate:fresh --force --no-interaction

      - name: Verify a second migration pass is idempotent
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: marketplace_test
          DB_USERNAME: marketplace_test
          DB_PASSWORD: test_only_password
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: php artisan migrate --force --no-interaction
