name: PHP lock refresh

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/php-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Update stable packages within declared constraints
        run: composer update --with-all-dependencies --no-interaction --no-progress --no-scripts --no-audit --no-security-blocking

      - name: Reject development package locks
        run: |
          php -r '$lock=json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR); foreach (array_merge($lock["packages"] ?? [], $lock["packages-dev"] ?? []) as $package) { $version=$package["version"] ?? ""; if (str_contains($version, "dev") || str_ends_with($version, "-dev")) { fwrite(STDERR, "Development dependency locked: {$package["name"]} {$version}\n"); exit(1); } }'

      - name: Validate refreshed lock
        run: composer validate --no-check-publish

      - name: Commit refreshed lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          if git diff --cached --quiet; then
            echo 'No lock changes required.'
          else
            git commit -m 'chore: lock stable PHP dependencies'
            git push origin HEAD:master
          fi
