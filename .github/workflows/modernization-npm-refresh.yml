name: Update candidate npm lockfile (experimental only)

on:
  push:
    branches:
      - modernization/laravel13-php84
    paths:
      - package.json
      - .github/workflows/modernization-npm-refresh.yml

permissions:
  contents: write

jobs:
  update-npm-lock:
    if: github.repository == 'AlirezaBelal/laravel-marketplace-demo' && github.ref == 'refs/heads/modernization/laravel13-php84'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate the npm lockfile without dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply non-breaking security fixes to npm lockfile only
        run: npm audit fix --package-lock-only --ignore-scripts --audit-level=high --no-fund

      - name: Install exact locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Vite production assets
        run: npm run build

      - name: Commit generated lockfile to experimental branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo 'npm lockfile is already synchronized.'
            exit 0
          fi
          git commit -m 'chore(modernization): generate Vite/Tailwind 4 npm lockfile'
          git push origin HEAD:refs/heads/modernization/laravel13-php84

      - name: Full npm security audit (must not suppress findings)
        run: npm audit --audit-level=high
