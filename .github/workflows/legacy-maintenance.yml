name: Legacy maintenance

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/legacy-maintenance.yml

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Refresh Composer lock metadata only
        run: composer update --lock --no-interaction --no-progress

      - name: Remove unsupported unused root frontend packages
        run: npm uninstall @ckeditor/ckeditor5-build-classic sweetalert2 --ignore-scripts

      - name: Remove legacy CKEditor runtime and keep textarea fallback
        run: |
          rm -rf public/ckeditor public/js/ckeditor.js
          python - <<'PY'
          from pathlib import Path
          import re

          head = Path('resources/views/livewire/admin/dashboard/head.blade.php')
          text = head.read_text(encoding='utf-8')
          text = text.replace("    <script src=\"{{asset('js/ckeditor.js')}}\"></script>\n", '')
          head.write_text(text, encoding='utf-8')

          for path in Path('resources/views').rglob('*.blade.php'):
              text = path.read_text(encoding='utf-8')
              updated = re.sub(r'\bClassicEditor\s*\n\s*\.create', 'window.ClassicEditor?.create', text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify dependency state
        run: |
          composer validate --no-check-publish
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Commit maintenance results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No maintenance changes to commit.'
          else
            git commit -m 'chore: retire unsupported CKEditor build and refresh locks'
            git push origin HEAD:master
          fi
