name: One-time current-tree sanitization

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-time-sanitize.yml

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sanitize tracked legacy templates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          view_root = Path('resources/views')
          for path in view_root.rglob('*.blade.php'):
              text = path.read_text(encoding='utf-8')
              original = text

              # Never commit browser API credentials. Blade resolves the optional key at runtime.
              text = re.sub(
                  r'key=AIza[0-9A-Za-z_-]{35}',
                  "key={{ config('services.google_maps.browser_key', '') }}",
                  text,
              )

              # Remove legacy copied/demo mobile numbers from tracked templates.
              text = re.sub(r'(?<![0-9])09[0-9]{9}(?![0-9])', '09000000000', text)
              text = re.sub(r'۰۹[۰-۹]{9}', '۰۹۰۰۰۰۰۰۰۰۰', text)

              if path.as_posix().endswith('home/setting/header/login.blade.php'):
                  text = re.sub(
                      r'<input type="hidden" id="ESILogged"[^>]*>',
                      '<input type="hidden" id="ESILogged" data-logged="1" data-user_id="{{ auth()->id() }}">',
                      text,
                      count=1,
                      flags=re.S,
                  )

              if path.as_posix().endswith('home/profile/index/aside.blade.php'):
                  text = re.sub(
                      r'<div class="c-profile-box__username">.*?</div>',
                      '<div class="c-profile-box__username">{{ optional(auth()->user())->name ?? \'حساب کاربری\' }}</div>',
                      text,
                      count=1,
                      flags=re.S,
                  )
                  text = re.sub(
                      r'<div class="c-profile-box__phone">.*?</div>',
                      '<div class="c-profile-box__phone">{{ optional(auth()->user())->mobile ?? \'\' }}</div>',
                      text,
                      count=1,
                      flags=re.S,
                  )

              if path.as_posix().endswith('home/profile/address/address.blade.php'):
                  text = re.sub(
                      r'data-address="\{&quot;.*?\}">',
                      'data-address=\'@json(["id" => $address->id, "full_name" => trim($address->name." ".$address->lname), "mobile_phone" => $address->mobile, "post_code" => $address->code_posti, "address" => $address->address])\'>',
                      text,
                      count=1,
                  )

              if text != original:
                  path.write_text(text, encoding='utf-8')

          services = Path('config/services.php')
          text = services.read_text(encoding='utf-8')
          if "'google_maps'" not in text:
              text = text.replace(
                  "\n];\n",
                  "\n    'google_maps' => [\n        'browser_key' => env('GOOGLE_MAPS_BROWSER_KEY'),\n    ],\n\n];\n",
              )
              services.write_text(text, encoding='utf-8')

          env_example = Path('.env.example')
          text = env_example.read_text(encoding='utf-8')
          if 'GOOGLE_MAPS_BROWSER_KEY=' not in text:
              text += "\n# Optional browser map integration. Keep the real key outside source control.\nGOOGLE_MAPS_BROWSER_KEY=\n"
              env_example.write_text(text, encoding='utf-8')

          # Delete this one-shot workflow in the sanitization commit so it cannot loop.
          Path('.github/workflows/one-time-sanitize.yml').unlink()
          PY

      - name: Verify high-risk patterns are gone
        run: |
          ! grep -R -E 'AIza[0-9A-Za-z_-]{35}' resources/views config .env.example
          ! grep -R -E '09120634157|۰۹۱۲۰۶۳۴۱۵۷' resources/views

      - name: Commit sanitization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: remove legacy credentials and personal fixture data"
          git push
